name: CI

on:
  pull_request:
    branches:
      - main
      - master
      - develop
  push:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate framework
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: |
          for file in $(find src -name "*.js" -print); do
            node --check "$file"
          done

      - name: Validate Cucumber step bindings
        run: npm test -- --dry-run

  ui-smoke:
    name: UI smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validate

    env:
      CI: true
      HEADLESS: true
      EXECUTION_MODE: remote-local

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run smart-locator smoke test
        run: npm run test:smoke

      - name: Run POM smoke test
        run: npm run test:pom

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-artifacts
          path: |
            target/reports/
            target/screenshots/
            target/videos/
            allure-results/
          if-no-files-found: ignore
          retention-days: 14
