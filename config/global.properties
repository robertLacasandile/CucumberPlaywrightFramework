# Supported values:
# local        = local browser, execution.headless controls headless
# remote-local = local browser, always headless
# remote-grid  = Playwright connects to a remote Playwright server, always headless
execution.mode=local
execution.browser=chromium
execution.headless=false
execution.parallel.enabled=auto
execution.parallel.max=3

remote.grid.url=ws://127.0.0.1:4444/
remote.grid.auto.manage=true
remote.grid.compose.file=playwright-grid-docker-compose.yml
remote.grid.start.timeout.seconds=60

# API readiness
api.base.url=http://localhost:3000
api.headers=

# Database readiness. Supported db.type values: none, postgres, mysql.
db.type=none
db.host=localhost
db.port=5432
db.name=
db.username=
db.password=

# Halaga iOS app: its screens are the web bundle the app loads in a WKWebView.
# The tests serve this folder on 127.0.0.1 and run it in WebKit with iPhone emulation.
app.halaga.dir=~/debt-planner/src/main/resources/ph/debtplanner/mobile
app.halaga.browser=webkit
app.halaga.device=iPhone 14 Pro
# native = run as the iOS app does (stubbed WKWebView bridge); web = the plain browser build
app.halaga.mode=native
app.halaga.biometry=faceID

# GitHub issues from test results (npm run test:halaga:issues, or npm run issues:sync after any run):
# one issue per failing scenario, closed again when it passes. Only scenarios with these tags are synced.
github.issues.repo=robertLacasandile/HalagaApplication
github.issues.tags=@halaga
github.issues.label=automated-test
# the app checkout whose HEAD is named as the tested commit (or set HALAGA_COMMIT)
github.issues.appDir=~/debt-planner
